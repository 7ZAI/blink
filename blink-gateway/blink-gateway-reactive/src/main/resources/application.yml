server:
  port: 8002
  tomcat:
    uri-encoding: UTF-8
    max-connections: 20000

spring:
  profiles:
    active: dev
  #  # 核心：允许Bean定义覆盖
  #  main:
  #    allow-bean-definition-overriding: true
  application:
    name: gateway-app

  config:
    import: optional:nacos:blink-gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      ## 配置文件中心
      config:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        server-addr: 127.0.0.1:8848
      ## 服务发现注册
      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
        server-addr: 127.0.0.1:8848
        ip: 10.186.131.120
logging:
  level:
    root: INFO
    com.blink.gateway.**: DEBUG
    io.github.resilience4j: DEBUG
  file:
    path: ./blink-gateway-reactive/logs

# ==================== Resilience4j 配置 ====================
resilience4j:
  # ==================== 熔断器配置 ====================
  circuitbreaker:
    # 配置模板
    configs:
      # 默认配置
      default:
        # 滑动窗口类型：基于计数
        slidingWindowType: COUNT_BASED
        # 滑动窗口大小：10次调用
        slidingWindowSize: 10
        # 最小调用次数：5次
        minimumNumberOfCalls: 5
        # 失败率阈值：50%
        failureRateThreshold: 50
        # 慢调用率阈值：100%
        slowCallRateThreshold: 100
        # 慢调用时间阈值：8秒
        slowCallDurationThreshold: 8000ms
        # OPEN 到 HALF_OPEN 的等待时间：60秒
        waitDurationInOpenState: 60s
        # HALF_OPEN 状态允许的调用数：3次
        permittedNumberOfCallsInHalfOpenState: 3
        # 自动转换到 HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 健康检查
        registerHealthIndicator: true
        # 记录所有异常
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException # 5xx HTTP错误
          - java.io.IOException                                    # 网络IO异常
          - java.util.concurrent.TimeoutException                  # 超时异常
          - java.net.SocketTimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
          - org.springframework.cloud.gateway.support.ServiceUnavailableException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

      # 严格模式配置
      strict:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 30  # 更低的失败率阈值
        waitDurationInOpenState: 120s  # 更长的等待时间
        permittedNumberOfCallsInHalfOpenState: 2

      # 宽松模式配置
      lenient:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 70  # 更高的失败率阈值
        waitDurationInOpenState: 30s  # 更短的等待时间
        permittedNumberOfCallsInHalfOpenState: 5

    # 熔断器实例配置 会继承没有被覆盖的默认配置
    instances:
      myCircuitBreaker:
        baseConfig: default

      resilientCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 60

      protectedCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 55

      strictCircuitBreaker:
        baseConfig: strict

      lenientCircuitBreaker:
        baseConfig: lenient

      userCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 45s

      imageCircuitBreaker:
        baseConfig: lenient
        failureRateThreshold: 80

  # ==================== 重试配置 ====================
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

    instances:
      myRetry:
        baseConfig: default

      quickRetry:
        maxAttempts: 2
        waitDuration: 500ms


  # ==================== 舱壁隔离配置(为不同的下游服务或接口分配独立的资源池) 信号量模式 ====================
  #  bulkhead:
  #    configs:
  #      default:
  #        maxConcurrentCalls: 10
  #        maxWaitDuration: 0ms
  #
  #    instances:
  #      myBulkhead:
  #        baseConfig: default
  #
  #      strictBulkhead:
  #        maxConcurrentCalls: 5

  # ==================== 时间限制器配置(单次调用的时间上限) ====================
#  timelimiter:
#    configs:
#      default:
#        timeoutDuration: 3s
#        cancelRunningFuture: true
#
#    instances:
#      myTimeLimiter:
#        baseConfig: default
#
#      shortTimeLimiter:
#        timeoutDuration: 1s
#
#      longTimeLimiter:
#        timeoutDuration: 5s

blink:
  gateway:
    config:
      ignore-intercept-url:
        - "/base/auth/login"
        - "/base/auth/getLoginConfig"
        - "/base/captcha/get"
        - "/base/captcha/check"
        - "/channel/issueChannelToken"