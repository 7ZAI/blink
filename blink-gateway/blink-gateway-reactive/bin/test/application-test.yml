server:
  port: 8002
  tomcat:
    uri-encoding: UTF-8
    max-connections: 20000

spring:
  profiles:
    active: dev
  #  # 核心：允许Bean定义覆盖
  #  main:
  #    allow-bean-definition-overriding: true
  application:
    name: gateway-app

  config:
    import: nacos:blink-gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      ## 配置文件中心
      config:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        server-addr: 127.0.0.1:8848
      ## 服务发现注册
      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
        server-addr: 127.0.0.1:8848
    loadbalancer:
      nacos:
        enabled: true
    ##路由配置
#    gateway:
#      # 全局默认过滤器，对所有路由生效
#      default-filters:
#        - name: RequestRateLimiter
#          args:
#            redis-rate-limiter.replenishRate: 100  # 令牌桶每秒填充速率
#            redis-rate-limiter.burstCapacity: 200  # 令牌桶总容量
#            key-resolver: "#{@ipKeyResolver}"      # 限流维度解析器
#      # 确保多个网关实例路由同步
#      #      discovery:
#      #        locator:
#      #          enabled: true
#
#      httpclient:
#        connect-timeout: 10000
#        response-timeout: 5s
#        #动态路由 由配置中心json配置
#      routes:
#        - id: base-app
#          uri: lb://base-app
#          predicates:
#            - Path=/base/**
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0 # 数据库索引
      lettuce:
        pool:
          max-active: 8 # 连接池最大活跃连接数（使用负值表示没有限制）
          max-idle: 8 # 连接池最大空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间 毫秒（使用负值表示没有限制）
          min-idle: 0 # 最小空闲连接数
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: INFO
  file:
    path: /logs
# actuator 监控
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"  # 暴露所有端点，生产环境建议按需暴露

# 自定义配置
blink:
  gateway:
    config:
      ip-filter:
        ip-filter-enable: true
        black-list-ips: 192.168.1.255, 192.43.0.256,2001:0db8:85a3:0000:0000:8a2e:0370:7334
        white-list-ips: 192.255.0.255, 2001:0DB8:85A3::8A2E:0370:7334
    configDataId: gateway-routes
    configGroup: DEFAULT_GROUP
    cache:
      localCacheEnable: true
      sync-listener-open: true
      stream-group-name: cache_sync_1
    dynamicRoute:
      mode: redis
      #      nacos:
      #        dataId: gateway-routes
      #        group: DEFAULT_GROUP
      redis:
        routeSuffix: default
        groupId: route-consumer-1
        streamkey: blink:stream:gateway:route
    ingnoredUrl:
      - /login
      - /captcha/get
  redis:
    enableLocalCache: false
    idGenerator:
      seq-param:
        request:
          step: 1000
          fetch-percent: 0.8
        trance:
          step: 2000

