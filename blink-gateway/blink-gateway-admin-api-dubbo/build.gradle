plugins {
    id 'java'
}

group = 'com.blink'
version = '1.0.0-SNAPSHOT'


dependencies {
    api "org.apache.dubbo:dubbo"
    api 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
    api 'com.blink:blink-framework-validation:1.0.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// 任务：生成源码JAR
java {
    withSourcesJar()
    modularity.inferModulePath = true
}

jar {
    enabled = true
    // 消除 打的包带 plain
    archiveClassifier = ''
    manifest {
        attributes('Implementation-Title': 'Gradle',
                'Implementation-Version': archiveVersion)
    }
}

tasks.named('jar') {
    // 设置JAR包的manifest属性
    manifest {
        attributes('Automatic-Module-Name': project.name)
    }

    // 确保包含所有必要的资源文件
    include 'META-INF/**'
    include '**/*.class'
}

javadoc {
    enabled = false
}

test {
    useJUnitPlatform()
}