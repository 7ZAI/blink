
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gateway?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    druid:
      initialSize: 8
      minIdle: 8
      maxActive: 500
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      filters: stat,wall,slf4j
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      remove-abandoned-timeout: 120
      remove-abandoned: true
      log-abandoned: true
      monitor:
        loginUsername: druid
        loginPassword: druid123
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1ms
          min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义部署配置
gateway-admin:
  deploy:
    # 部署模式: single(单实例) / cluster(多实例集群)
    mode: single
    # 权限缓存开关（多实例必须开启）
    cache-enabled: false

# SA-Token 配置
sa-token:
  token-name: x-blink-token
  timeout: 604800           # Token 有效期 7 天
  active-timeout: 7200      # 活动超时 2 小时
  is-concurrent: true       # 允许多端登录
  is-share: false           # 每次登录生成新 Token
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  # Redis 存储 token 数据，解决服务重启后 token 失效问题
  # 注意：必须与 spring.data.redis.database 保持一致（使用 database 0）
  alone-redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password: 123456



# Dubbo 配置
dubbo:
  application:
    name: gateway-admin
    qos-enable: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://127.0.0.1:8848
    namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
  consumer:
    check: false
    timeout: 10000

# 网关监控配置
blink:
  redis:
    distributed-lock:
      enabled: true
      key-prefix: "blink:lock:"
      watchdog-enabled: true
  gateway:
    # SSE 连接配置
    sse:
      # 开发环境允许更多连接，避免频繁触发限制
      max-connections-per-user: 10
      max-total-connections: 1000
      connection-timeout: 1800000  # 30 分钟
      heartbeat-interval: 30000    # 30 秒
      registry-ttl: 120            # 120 秒
    monitor:
      # 监控消息推送/消费总开关（配置文件默认值）
      # 实际开关由 Nacos 配置中心动态控制
      enabled: true
      # 历史数据保留天数
      history-retention-days: 7
      # CPU 使用率变化阈值（百分比）
      cpu-change-threshold: 10
      # 堆内存使用率变化阈值（百分比）
      heap-change-threshold: 10
      # Nacos 动态配置
      config:
        data-id: gateway-monitor-config.json
        group: DEFAULT_GROUP
      # Stream 消费配置（仅 gateway-admin 使用）
      stream-consume:
        stream-key: "blink:gateway:metrics:stream"
        consumer-group: "gateway-admin"
        consumer-name-prefix: "consumer-"
        batch-size: 10
        poll-interval-ms: 1000
