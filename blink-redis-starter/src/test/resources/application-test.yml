
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1ms
          min-idle: 0
logging:
  level:
    com.blink.framework.redis: DEBUG
    reactor.netty.http.client: INFO
  file:
    path: /logs

server:
  port: 8080
  servlet:
    context-path: /myapp
blink:
  redis:
    enableLocalCache: false
    distributed-lock:
      enabled: true
      default-wait-time: 3s
      default-lease-time: 30s
      watchdog-enabled: true
      key-prefix: "lock:"
      retry-count: 3
    idGenerator:
      seq-param:
        mq_msg_id:
          step: 1000
          fetch-percent: 0.8
        test:
          step: 3000
          fetch-percent: 0.4
        request:
          step: 3000
