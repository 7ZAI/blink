spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0 # 数据库索引
      lettuce:
        pool:
          max-active: 8 # 连接池最大活跃连接数（使用负值表示没有限制）
          max-idle: 8 # 连接池最大空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间 毫秒（使用负值表示没有限制）
          min-idle: 0 # 最小空闲连接数
logging:
  level:
    com.blink.framework.redis: DEBUG
    reactor.netty.http.client: INFO
  file:
    path: /logs


blink:
  redis:
    enableLocalCache: false
    idGenerator:
      key-steps:
        MQ_MSG_ID: 100
        test: 2000
        #获取阈值 达到80%取值
      fetchPercent: 0.5