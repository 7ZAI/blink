plugins {
    id 'org.springframework.boot'
}

// 任务：生成源码JAR
java {
    withSourcesJar()
    modularity.inferModulePath = true
}

jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // 也可以单独指定 groupId, artifactId, version，如果未指定，则使用项目默认的
            groupId = 'com.blink'
            artifactId = 'blink-redis-spring-boot-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
//    implementation 'org.redisson:redisson-spring-boot-starter:3.23.1'

    api "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
    implementation 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
    implementation 'cn.hutool:hutool-core'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'
    
    // Redisson for distributed lock (optional)
    compileOnly "org.redisson:redisson-spring-boot-starter:${redissonVersion}"
    testImplementation "org.redisson:redisson-spring-boot-starter:${redissonVersion}"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    
    // ============ 测试框架 ============
    testImplementation 'com.blink:blink-framework-test:1.0.0-SNAPSHOT'
    testImplementation "org.redisson:redisson-spring-boot-starter:${redissonVersion}"

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'


}

test {
    useJUnitPlatform()
}




