publishing {
    publications {
        mavenJava(MavenPublication) {
            // 也可以单独指定 groupId, artifactId, version，如果未指定，则使用项目默认的
            groupId = 'com.blink'
            artifactId = 'blink-redis-spring-boot-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
//    implementation 'org.redisson:redisson-spring-boot-starter:3.23.1'

    api "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
    implementation 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
    implementation 'cn.hutool:hutool-core'
    implementation "com.alibaba.fastjson2:fastjson2-extension-spring6:${fastjson2Extension}"


    //注释切换环境
//    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.projectreactor:reactor-test'


}

test {
    useJUnitPlatform()
}




