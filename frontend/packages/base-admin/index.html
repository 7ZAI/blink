<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink</title>
    <style>
      /* 初始加载动画 - 防止黑色闪烁 */
      #app {
        opacity: 0;
        transition: opacity 0.4s ease-out;
      }
      #app.app-ready {
        opacity: 1;
      }
      /* 初始加载遮罩 */
      .app-loading-mask {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .app-loading-mask.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .app-loading-spinner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .app-loading-logo {
        width: 48px;
        height: 48px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .app-loading-logo svg {
        width: 100%;
        height: 100%;
        fill: #3b82f6;
        filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      .app-loading-bar {
        width: 200px;
        height: 4px;
        background: rgba(59, 130, 246, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .app-loading-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        border-radius: 2px;
        animation: loading-bar 1.5s ease-in-out infinite;
      }
      @keyframes loading-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      /* 深色模式适配 */
      @media (prefers-color-scheme: dark) {
        .app-loading-mask {
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
      }
    </style>
  </head>
  <body>
    <!-- 初始加载遮罩 -->
    <div class="app-loading-mask" id="app-loading">
      <div class="app-loading-spinner">
        <div class="app-loading-logo">
          <svg viewBox="0 0 12 32">
            <path d="M7 2L2 14h5l-2 12 9-16h-5l2-8z"/>
          </svg>
        </div>
        <div class="app-loading-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
