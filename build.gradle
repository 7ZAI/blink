
// 根工程核心配置（仅聚合，无源码）
plugins {
    id 'base' // 仅保留基础插件，移除java/java-library避免触发源码目录
    id 'idea'
    id 'maven-publish'  // 发布插件仅子模块应用
    id 'io.spring.dependency-management' apply false
    id 'org.springframework.boot' apply false
    // Jacoco 是 Gradle 核心插件，在 subprojects 中直接应用
}

// 全局版本常量
ext {
    // 框架版本
    springBootVersion = '3.2.7'
    springCloudVersion = '2023.0.3'
    springCloudAlibaba = '2023.0.3.2'
    // 第三方工具版本
    hutoolVersion = '5.8.29'
    lombokVersion = '1.18.34'
    mysqlConnectorVersion = '8.0.33'
    mybatisPlusVersion = '3.5.16'
    druidStarterVersion = '1.2.18'
    pagehelperVersion = '5.3.1'
    httpclient5Version = '5.2.1'
    caffeineVersion = '3.1.8'
    jacksonVersion = '2.14.3'
    jjwtVersion = '0.13.0'
    dubboVersion = '3.3.0'
    redissonVersion = '3.27.0'
    // 测试框架版本
    jacocoVersion = '0.8.11'
}

group = 'com.blink'
version = '1.0.0-SNAPSHOT'
description = 'Blink框架'

// ========== 核心：彻底禁用根工程源码目录和无用任务 ==========
// 方式更优雅：直接移除源码集，而非指向none目录
if (project == rootProject) {
    // 移除所有源码集（从根源阻止生成src/main/test）
//    sourceSets.removeIf { true }

    // 禁用所有无意义的任务（比逐个禁用更全面）
    tasks.withType(JavaCompile).configureEach { enabled = false }
    tasks.withType(ProcessResources).configureEach { enabled = false }
    tasks.withType(Test).configureEach { enabled = false }
    tasks.withType(Jar).configureEach { enabled = false }
    tasks.withType(Javadoc).configureEach { enabled = false }
//    tasks.withType(SourceJar).configureEach { enabled = false }

    // 可选：清理可能误生成的src目录
    task cleanUnusedSrcDirs(type: Delete) {
        delete fileTree(dir: rootDir, include: 'src/**')
    }
//    clean.dependsOn cleanUnusedSrcDirs
}

// ========== 子模块统一配置（复用+规范） ==========
subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version
    description = "${project.name} 子模块"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // 可选：生成源码包和文档包（发布时用）
        withSourcesJar()
        withJavadocJar()
    }

    // ========== 编译配置（统一编码+注解处理器） ==========
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
        // 排除重复依赖（可选，解决依赖冲突）
        all {
            exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        // 编译优化：启用增量编译、警告提示
        options.incremental = true
        options.compilerArgs += [
                '-Xlint:unchecked',
                '-Xlint:deprecation',
                '-parameters' // 保留方法参数名，方便反射/MyBatis等使用
        ]
    }
    
    // Javadoc 编码配置 - 全局跳过 javadoc 检查
    tasks.withType(Javadoc) {
        enabled = false  // 禁用所有 javadoc 任务
    }
    
    // 禁用 javadocJar 任务
    tasks.named('javadocJar').configure {
        enabled = false
    }
    
    // Test 编码配置
    tasks.withType(Test) {
        jvmArgs = ['-Dfile.encoding=UTF-8']
    }

    // ========== 仓库配置（提取为方法，方便复用） ==========
    repositories {
        mavenLocal()
        maven {
            allowInsecureProtocol true
            url "http://localhost:8081/repository/maven-public/"
            credentials {
                username project.findProperty('repositories.username')
                password project.findProperty('repositories.password')
            }
            // 优先级：私有仓库 > 中央仓库
            mavenCentral()
        }
    }

    // ========== 依赖管理（BOM统一版本，避免硬编码） ==========
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibaba}"
            mavenBom "cn.hutool:hutool-bom:${hutoolVersion}"
            mavenBom "org.apache.dubbo:dubbo-bom:${dubboVersion}" // Dubbo BOM 移入此处更规范
        }
        // 补充非BOM管理的版本（统一管控）
        dependencies {
            dependency "org.projectlombok:lombok:${lombokVersion}"
            dependency "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"
            dependency "com.baomidou:mybatis-plus-boot-starter:${mybatisPlusVersion}"
            dependency "com.alibaba:druid-spring-boot-starter:${druidStarterVersion}"
            dependency "com.github.pagehelper:pagehelper-spring-boot-starter:${pagehelperVersion}"
            dependency "org.apache.httpcomponents.client5:httpclient5:${httpclient5Version}"
            dependency "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
            dependency "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            dependency "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        }
    }

    // ========== 公共依赖（所有子模块共享） ==========
    dependencies {
        // Lombok（编译时注解）
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        // 测试依赖（统一Junit5）
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        // Dubbo 基础依赖（按需引入，此处仅声明BOM，子模块自行引入具体依赖）
        // implementation 'org.apache.dubbo:dubbo-spring-boot-starter'
    }

    // ========== 发布配置（提取为方法，避免冗余） ==========
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                // 复用根工程的group/version，仅artifactId用模块名（规范）
                groupId = rootProject.group
                artifactId = project.name
                version = rootProject.version

                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                // 可选：添加POM自定义信息（如开发者、许可证）
                pom {
                    name = project.name
                    description = project.description
                    url = ''
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }

        // ========== 发布仓库配置（发布依赖用） ==========
        repositories {
            // 发布到私有仓库（根据版本自动切换快照/正式）
            maven {
                allowInsecureProtocol true
                name = 'nexus'
                // 根据模块版本自动切换仓库（复用根工程/子模块version）
                url = project.version.toString().endsWith('SNAPSHOT') ?
                        "http://localhost:8081/repository/maven-snapshots/" :
                        "http://localhost:8081/repository/maven-releases/"
                credentials {
                    username project.findProperty('repositories.username')
                    password project.findProperty('repositories.password')
                }
            }
        }
    }

    // ========== 测试任务优化 ==========
    tasks.test {
        useJUnitPlatform() // 启用Junit5
        testLogging {
            events 'PASSED', 'FAILED', 'SKIPPED'
            showStackTraces = true
            showCauses = true
        }
        // 并行测试（加快测试速度）
        maxParallelForks = Runtime.runtime.availableProcessors() / 2
    }

    // ========== Jacoco 覆盖率配置（新增） ==========
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = rootProject.ext.jacocoVersion
    }

    tasks.test {
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        reports {
            xml.required = true   // CI 报告格式
            html.required = true  // 本地查看
            csv.required = false
        }
        // 排除非业务代码
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/*Config.class',
                    '**/*Configuration.class',
                    '**/*Application.class',
                    '**/dto/**',
                    '**/entity/**',
                    '**/exception/**'
                ])
            }))
        }
    }

    // 覆盖率验证（本地不强制阈值）
    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit {
                    minimum = 0.0
                }
            }
        }
    }
}

// ========== 根工程聚合任务 ==========

// 聚合所有子模块覆盖率报告
task jacocoRootReport(type: JacocoReport) {
    description = '生成所有子模块的聚合覆盖率报告'
    group = 'verification'
    dependsOn subprojects*.test

    executionData.setFrom(files(subprojects*.jacocoTestReport*.executionData))
    classDirectories.setFrom(files(subprojects*.jacocoTestReport*.classDirectories))
    sourceDirectories.setFrom(files(subprojects*.jacocoTestReport*.sourceDirectories))

    reports {
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/jacoco.xml')
    }
}

// ========== 本地 CI 任务组合 ==========

// 快速 CI 任务（适合 pre-commit）
task ciQuick(type: GradleBuild) {
    description = '快速 CI 检查 - 编译 + 关键模块测试'
    group = 'ci'
    tasks = ['compileJava', ':blink-framework-common:test', ':blink-web-starter:test']
}

// 完整后端 CI 任务
task ciBackend(type: GradleBuild) {
    description = '完整后端 CI - 编译 + 测试 + 覆盖率'
    group = 'ci'
    tasks = ['compileJava', 'compileTestJava', 'test', 'jacocoRootReport']
}

// 仅单元测试 CI
task ciUnitTest(type: GradleBuild) {
    description = '仅运行单元测试'
    group = 'ci'
    tasks = ['test']
}

// 集成测试 CI（需要先配置集成测试源集）
task ciIntegration(type: GradleBuild) {
    description = '仅运行集成测试'
    group = 'ci'
    tasks = ['integrationTest']
}

// ========== 测试分类任务（新增） ==========

// 单元测试任务 - 仅运行带 @Tag("unit") 的测试
task unitTest(type: Test) {
    description = '运行所有单元测试（不依赖外部容器）'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'unit'
        excludeTags 'integration', 'repository'
    }
}

// 集成测试任务 - 仅运行带 @Tag("integration") 的测试
task integrationTest(type: Test) {
    description = '运行所有集成测试（需要 Testcontainers/Docker）'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
}

// Repository 测试任务 - 仅运行带 @Tag("repository") 的测试
task repositoryTest(type: Test) {
    description = '运行所有数据层测试（使用 H2 内存数据库）'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'repository'
    }
}

// 快速 CI（仅单元测试，无需 Docker）
task ciQuickTest(type: GradleBuild) {
    description = '快速 CI - 仅运行单元测试'
    group = 'ci'
    tasks = ['compileJava', 'unitTest']
}

// 完整 CI（包含集成测试，需要 Docker）
task ciFullTest(type: GradleBuild) {
    description = '完整 CI - 运行所有测试'
    group = 'ci'
    tasks = ['compileJava', 'unitTest', 'repositoryTest', 'integrationTest', 'jacocoRootReport']
}