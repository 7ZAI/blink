server:
  port: 8002
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    max-connections: 20000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

spring:
  profiles:
    active: dev
#  # 核心：允许Bean定义覆盖
#  main:
#    allow-bean-definition-overriding: true
  application:
    name: gateway-app
  cloud:
    nacos:
      ## 配置文件中心
      config:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        server-addr: 127.0.0.1:8848
        file-extension: json
      ## 服务发现注册
      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
        server-addr: 127.0.0.1:8848
    loadbalancer:
      nacos:
        enabled: true

logging:
  level:
    root: INFO
    com.blink.gateway.**: DEBUG
  file:
    path: ./blink-gateway-reactive/logs

blink:
  gateway:
    ingnoredUrl:
      - "/login"
      - "/captcha/get"