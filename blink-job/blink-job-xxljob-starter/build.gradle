plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    // 依赖核心模块
    implementation project(':blink-job:blink-job-core')

    // 直接依赖 API 模块
    implementation project(':blink-job:blink-job-api')

    // Spring 调度支持
    implementation 'org.springframework.boot:spring-boot-starter'

    // XXL-Job 核心
    implementation 'com.xuxueli:xxl-job-core:2.4.0'

    // 工具类
    implementation 'cn.hutool:hutool-core'
    implementation 'cn.hutool:hutool-json'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.blink'
            artifactId = 'blink-job-xxljob-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}
