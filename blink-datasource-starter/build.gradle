publishing {
    publications {
        mavenJava(MavenPublication) {
            // 也可以单独指定 groupId, artifactId, version，如果未指定，则使用项目默认的
            groupId = 'com.blink'
            artifactId = 'blink-dataSource-spring-boot-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}

dependencies {

    implementation "com.baomidou:mybatis-plus-generator:${mybatisPlusVersion}"
    api("com.baomidou:mybatis-plus-boot-starter:${mybatisPlusVersion}"){
        exclude group: 'org.mybatis', module: 'mybatis-spring'
    }
    implementation "mysql:mysql-connector-java:${mysqlConnectorVersion}"
    implementation "com.alibaba:druid-spring-boot-starter:${druidStarterVersion}"
    implementation "com.github.pagehelper:pagehelper:${pagehelperVersion}"
    implementation 'org.apache.velocity:velocity:1.7'
    implementation 'org.mybatis:mybatis-spring:3.0.3'
    implementation 'cn.hutool:hutool-core'

    implementation 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
}


tasks.named('test') {
    useJUnitPlatform()
}
