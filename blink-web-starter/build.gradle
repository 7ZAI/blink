plugins {
    id 'org.springframework.boot'
}


// 任务：生成源码JAR
java {
    withSourcesJar()
    modularity.inferModulePath = true
}

jar {
    enabled = true
    // 消除 打的包带 plain
    archiveClassifier = ''
    manifest {
        attributes('Implementation-Title': 'Gradle',
                'Implementation-Version': archiveVersion)
    }
}
//
//tasks.named('jar') {
//    // 设置JAR包的manifest属性
//    manifest {
//        attributes('Automatic-Module-Name': project.name)
//        // 如果需要，你也可以在这里指定主类 (Main-Class)
//        // attributes('Main-Class': 'com.yourcompany.yourmodule.MainClass')
//    }
//
//    // 确保包含所有必要的资源文件
//    include 'META-INF/**'
//    include '**/*.class' // 这行通常可以省略，因为jar任务默认包含编译输出的class文件
//}


publishing {
    publications {
        mavenJava(MavenPublication) {
            // 也可以单独指定 groupId, artifactId, version，如果未指定，则使用项目默认的
            groupId = 'com.blink'
            artifactId = 'blink-web-spring-boot-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}


dependencies {


    implementation 'cn.hutool:hutool-core'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-web'


    implementation 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
    implementation 'com.blink:blink-dataSource-spring-boot-starter:1.0.0-SNAPSHOT'
    implementation 'com.blink:blink-redis-spring-boot-starter:1.0.0-SNAPSHOT'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}





tasks.named('test') {
    useJUnitPlatform()
}
