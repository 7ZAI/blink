//    include 'META-INF/**'
//    include '**/*.class' // 这行通常可以省略，因为jar任务默认包含编译输出的class文件
//}


publishing {
    publications {
        mavenJava(MavenPublication) {
            // 也可以单独指定 groupId, artifactId, version，如果未指定，则使用项目默认的
            groupId = 'com.blink'
            artifactId = 'blink-web-spring-boot-starter'
            version = '1.0.0-SNAPSHOT'
        }
    }
}


dependencies {


    implementation 'cn.hutool:hutool-core'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Resilience4j 限流熔断
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter'
    implementation 'io.github.resilience4j:resilience4j-retry'
    implementation 'io.github.resilience4j:resilience4j-bulkhead'

    implementation 'com.blink:blink-framework-common:1.0.0-SNAPSHOT'
//    implementation 'com.blink:blink-dataSource-spring-boot-starter:1.0.0-SNAPSHOT'
//    implementation 'com.blink:blink-redis-spring-boot-starter:1.0.0-SNAPSHOT'

    // ============ 测试框架 ============
    testImplementation 'com.blink:blink-framework-test:1.0.0-SNAPSHOT'
//    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
//    testImplementation 'org.testcontainers:junit-jupiter'
//    testImplementation 'org.assertj:assertj-core'1
//    testImplementation 'org.awaitility:awaitility'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}





tasks.named('test') {
    useJUnitPlatform()
}
