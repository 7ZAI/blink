plugins {
    id 'java'
}

group = 'com.blink'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    api "org.apache.dubbo:dubbo"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}