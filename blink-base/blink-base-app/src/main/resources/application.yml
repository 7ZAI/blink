server:
  port: 8001
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    max-connections: 20000
  servlet:
    context-path: /base

spring:
  profiles:
    active: dev
  application:
    name: base-app
  ##
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
      config:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
  config:
    import:
      - nacos:base-app.yaml?refreshEnabled=true

  ##彩色输出
  output:
    ansi:
      enabled: always
  main:
    allow-bean-definition-overriding: false
  #  ## 本地缓存
  #  cache:
  #    cache-names: "cache1,cache2"
  #    caffeine:
  #      spec: "maximumSize=500,expireAfterAccess=600s"
  jackson:
    # 全局日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

    # 必须禁用时间戳格式
    serialization:
      write-dates-as-timestamps: false

    # 允许更灵活的反序列化
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: true



logging:
  level:
    root: INFO
    com.blink: DEBUG
  file:
    path: ./blink-base/blink-base-app/logs

# 验证码配置
blink:
  captcha:
    type: clickWord                 # 验证码类型: clickWord(点选文字) / blockPuzzle(滑块拼图)

# ==================== Flowable工作流引擎配置 ====================
flowable:
  # 自动部署流程定义（开发环境开启，生产环境建议关闭）
  check-process-definitions: false
  # 异步执行器配置
  async-executor-activate: true
  # 数据库表结构自动更新（开发环境true，生产环境false）
  database-schema-update: true
  # IDM引擎配置
  idm:
    # 启用IDM引擎
    enabled: true
  # 流程定义缓存配置
  process-definition-cache-limit: 512






