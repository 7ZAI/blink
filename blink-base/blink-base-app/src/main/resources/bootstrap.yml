server:
  port: 8001
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    max-connections: 20000
  servlet:
    context-path: /base

spring:
  profiles:
    active: dev
  application:
    name: base-app
  ##
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

  cloud:
    nacos:
      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
        server-addr: 127.0.0.1:8848
#      config:
#        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
#        server-addr: 127.0.0.1:8848
#        file-extension: yaml
  ##彩色输出
  output:
    ansi:
      enabled: always
  main:
    allow-bean-definition-overriding: false
#  ## 本地缓存
#  cache:
#    cache-names: "cache1,cache2"
#    caffeine:
#      spec: "maximumSize=500,expireAfterAccess=600s"


logging:
  level:
    root: INFO
  file:
    path: ./blink-base/blink-base-app/logs






