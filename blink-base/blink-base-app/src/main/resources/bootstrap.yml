server:
  port: 8001
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    max-connections: 20000
  servlet:
    context-path: /base

spring:
  profiles:
    active: dev
  application:
    name: base-app
  ##
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

  cloud:
    nacos:
      config:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        server-addr: 127.0.0.1:8848

      discovery:
        namespace: 94984ad7-b510-4ca4-bdcb-b6cdbd437dfb
        enabled: true
        server-addr: 127.0.0.1:8848

  ##彩色输出
  output:
    ansi:
      enabled: always
  main:
    allow-bean-definition-overriding: false
#  ## 本地缓存
#  cache:
#    cache-names: "cache1,cache2"
#    caffeine:
#      spec: "maximumSize=500,expireAfterAccess=600s"
  jackson:
    # 全局日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

    # 必须禁用时间戳格式
    serialization:
      write-dates-as-timestamps: false

    # 允许更灵活的反序列化
    deserialization:
      fail-on-unknown-properties: false
      adjust-dates-to-context-time-zone: true



logging:
  level:
    root: INFO
  file:
    path: ./blink-base/blink-base-app/logs






