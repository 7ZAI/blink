
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blink?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    druid:
      initialSize: 8
      minIdle: 8
      maxActive: 500
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      filters: stat,wall,slf4j
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      #连接在多少秒后应该考虑弃用
      remove-abandoned-timeout: 120
      #被弃用的连接在到达弃用超时后是否应该被移除
      remove-abandoned: true
      #打印回收连接时的错误日志
      log-abandoned: true
      monitor:
        loginUsername: druid
        loginPassword: druid123
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0 # 数据库索引
      lettuce:
        pool:
          max-active: 8 # 连接池最大活跃连接数（使用负值表示没有限制）
          max-idle: 8 # 连接池最大空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间 毫秒（使用负值表示没有限制）
          min-idle: 0 # 最小空闲连接数
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
feign:
  httpclient:
    enabled: true
    #max connection for http client
    maxTotal: 300
    #max per route connection for http client
    maxPerRoute: 20
    #Returns the duration of time which this connection can be safely kept idle
    alive: 60000
    #idle timeout for connection /ms
    idleTimeoutMillis: 30000
    #clear expire and idle timeout http connections schedule rate
    closedConnectionsRate: 30000

  # feign compression support
  compression:
    request:
      enabled: true
      mime-types: application/json
      min-request-size: 2048
    response:
      enabled: true

