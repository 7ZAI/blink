repositories.username=admin
repositories.password=123456

# WSL 内存优化配置
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.configuration-cache=false
org.gradle.caching=false
org.gradle.workers.max=1

# Gradle JVM 内存限制
# 原值 512m 在多服务并发启动时可能导致 OOM，调整为 768m
org.gradle.jvmargs=-Xmx768m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8


